<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disney Hitster</title>
    <style>
        body {
            background-color: #0d1b2a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            padding: 20px;
            max-width: 300px;
        }
        h2 {
            color: #e0a96d;
            margin-bottom: 30px;
            font-size: 1.5rem;
        }
        button {
            background-color: #e0a96d;
            color: #0d1b2a;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(224, 169, 109, 0.4);
            transition: transform 0.2s;
        }
        button:active {
            transform: scale(0.95);
        }
        .status {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #8d99ae;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎵 Disney Hitster</h2>
        <button id="playBtn" onclick="togglePlay()">Reproducir Pista</button>
        <div class="status" id="statusText">Pulsa para escuchar</div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        // Leer el número de pista de la URL (ej: ?pista=5)
        const urlParams = new URLSearchParams(window.location.search);
        const pista = urlParams.get('pista') || '1';
        
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const statusText = document.getElementById('statusText');

        // Asignar la ruta del archivo MP3 correspondiente
        audio.src = `audios/${pista}.mp3`;

        function togglePlay() {
            if (audio.paused) {
                audio.play().then(() => {
                    playBtn.textContent = "Pausar";
                    statusText.textContent = "Reproduciendo fragmento...";
                }).catch(e => {
                    statusText.textContent = "Error al reproducir audio.";
                });
            } else {
                audio.pause();
                playBtn.textContent = "Reproducir Pista";
                statusText.textContent = "En pausa";
            }
        }

        audio.onended = function() {
            playBtn.textContent = "Reproducir de nuevo";
            statusText.textContent = "Fin del fragmento";
        };
    </script>

</body>
</html>
